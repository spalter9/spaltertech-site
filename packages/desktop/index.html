<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSP Desktop Shell</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --panel: #141418;
        --accent: #00f0ff;
        --text: #f0f0f5;
        --muted: #8a8a9e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: min(440px, calc(100% - 2rem));
        background: var(--panel);
        border: 1px solid #22222d;
        border-radius: 12px;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        background: var(--accent);
        color: #000;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SSP // Desktop Shell</h1>
      <p>
        This package is the Electron wrapper for Spalter Tech. Local desktop
        builds load the web app; this page exists so Vercel preview deploys have
        a valid static output.
      </p>
      <p style="margin-top:1.25rem;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent)">
        Sovereign Sign Protocol
      </p>
    </main>
    <script type="module" src="/electron/__no-renderer.ts"></script>
  </body>
</html>
