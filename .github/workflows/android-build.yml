name: Build Surreal Audio Android APK

# Builds an installable debug APK on GitHub's own runners, which have
# normal internet access to Google's Maven repo — unlike the sandbox this
# app was developed in, which has that network path blocked. This is the
# only way to get an actual installable app file out of this branch right
# now, short of someone opening the project in a real Android Studio.

on:
  push:
    branches: [claude/fill-fixed-stuff-code-p35th8]
    paths:
      - 'android/SurrealAudio/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/SurrealAudio
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install required Android SDK components
        # ubuntu-latest runners ship with an Android SDK pre-installed
        # (ANDROID_HOME already set) — no setup action needed. The
        # android-actions/setup-android action was tried here first and
        # failed: it tries to install a legacy 'tools' package Google
        # removed from the SDK repository years ago, and crashes before
        # reaching any of the actual build steps.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify the DSP engine (pure-JVM, no Android SDK needed)
        run: ./gradlew :dsp:run --console=plain --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: surreal-audio-debug-apk
          path: android/SurrealAudio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Stage the built APK on a plain branch
        # The build artifact above sits behind an Azure blob storage URL
        # that the development sandbox for this repo can't reach
        # (network policy blocks that host, same as it blocks
        # dl.google.com). This runner has normal internet access, so
        # instead of trying to route the binary back through that
        # blocked path, it just commits the APK to an ordinary branch —
        # retrievable from anywhere with a plain `git fetch`, no special
        # access needed. This deliberately does NOT push to main or any
        # production branch — publishing to the live site stays a
        # normal, reviewed push, same as every other change to this repo.
        working-directory: .
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add -B android-apk-build /tmp/apk-publish origin/main
          mkdir -p /tmp/apk-publish/sspengine-static/downloads
          cp android/SurrealAudio/app/build/outputs/apk/debug/*.apk /tmp/apk-publish/sspengine-static/downloads/surreal-audio.apk
          cd /tmp/apk-publish
          git add sspengine-static/downloads/surreal-audio.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to stage"
          else
            git commit -m "Android test build APK (from CI run ${{ github.run_id }})"
            git push -f origin HEAD:android-apk-build
          fi
